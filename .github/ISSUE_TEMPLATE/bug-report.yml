name: 버그 신고 · Bug report
description: 게임이 이상하게 움직였을 때 / Something in the game went wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        알려 주셔서 고맙습니다. 아래 칸을 채워 주면 우리가 더 빨리 다시 만들어 볼 수 있습니다.
        Thank you for reporting. Korean, English and Japanese are all fine.
  - type: textarea
    id: what
    attributes:
      label: 무엇이 일어났나요? · What happened?
      placeholder: 예) 사건 05에서 밀어붙인다를 눌렀는데 판돈이 그대로였습니다.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 어느 사건·장면에서? · Which case or scene?
      placeholder: 예) 프롤로그 02 / Case 05, scene 3
  - type: dropdown
    id: device
    attributes:
      label: 기기 · Device
      options:
        - 휴대폰 · Phone
        - 태블릿 · Tablet
        - PC
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 브라우저와 화면 크기 · Browser and screen
      placeholder: 예) Galaxy S24 Chrome / iPhone 15 Safari / Windows Edge 1920x1080
  - type: dropdown
    id: language
    attributes:
      label: 게임 언어 · Game language
      options:
        - 한국어
        - English
        - 日本語
  - type: textarea
    id: shot
    attributes:
      label: 화면 캡처 (있으면) · Screenshot (optional)
      description: 이름·메일 같은 개인 정보가 보이지 않게 가려 주세요. / Please hide any personal details.

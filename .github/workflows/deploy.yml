name: Deploy

# Deploying is a push-button in the Render dashboard until something presses it,
# and `autoDeploy: true` in render.yaml does not press it: that file is a
# Blueprint spec and only governs a service Render manages as one, so a service
# created by hand keeps whatever its dashboard says. This workflow is the press.
#
# It hangs off Verify rather than off the push, so what reaches the site is a
# commit whose full suite went green -- including the end-to-end tier, which the
# Render build command does not run. A push that fails CI cannot become a
# deployment.
#
# The press names its commit. A deploy hook with no `ref` builds whatever the
# branch head is when Render gets round to it, which is not the commit Verify
# proved: on 2026-09-27 the hook fired for 160f304 and Render built 4b420f0,
# sixteen minutes before that commit's own Verify had finished, and the check
# below passed because 4b420f0 "contained" the one it was waiting for. The
# hook now carries `ref=<the verified commit>` and the wait accepts that commit
# and no other.
#
# Pressing and checking are one job, so they are one unit in the queue. As two
# jobs the second deploy could press its button between the first deploy's press
# and the first deploy's check, and the check then waited twenty minutes for a
# commit the site had already moved past.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    # Verify also completes for every pull request and every label. Those runs
    # can never deploy, and each one used to create a Deploy run that queued
    # with the real ones: eight inside one minute on 2026-09-27.
    branches: [main]
  # By hand, for the two things the automatic path will not do: deploy a commit
  # again, and put an older one back. The automatic path refuses a rollback by
  # design (the guard below), so this is the rollback.
  #
  # A dispatch used to be "a person choosing, taken at its word": it deployed
  # the head of whichever ref the button was pressed on, before asking whether
  # that commit was on main or whether Verify had finished for it, and it could
  # not name an older commit at all. It now names its commit and passes the
  # same gate the automatic path stands behind, unless `force` says otherwise
  # out loud.
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit to deploy: all 40 characters. Empty deploys the head of the ref this is run on."
        type: string
        default: ""
      force:
        description: "Deploy it even if it is not on main or has no green Verify run from its push. Leaves a warning on the run."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Render's static builds take a few minutes; the wait below gives up at 20.
    timeout-minutes: 35
    # One deploy at a time, and never cancelled halfway: a newer one waits. The
    # group is on the job, not the workflow, so a run whose job is skipped -- a
    # Verify that went red -- never enters the queue and cannot push a pending
    # deploy out of it. GitHub keeps one pending run per group; when a third
    # deploy arrives the second is dropped, which is the right one to drop,
    # because the third contains it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # `actions: read` is for the one question a dispatch asks: did Verify pass
    # for this commit.
    permissions:
      contents: read
      actions: read
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
      FORCE: ${{ inputs.force == true }}
    steps:
      # The input is typed by a person and ends up in a URL and a checkout. A
      # branch name or a short hash would also mean different commits to
      # different steps, so it is a whole hash or nothing.
      - name: Check the commit named by hand
        if: env.MANUAL == 'true'
        shell: bash
        run: |
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error title=Nothing was deployed::\`sha\` has to be a full 40-character commit hash (git rev-parse <commit>)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          # The guard below compares commits, so it needs the history.
          fetch-depth: 0
      # No `npm ci`: the deploy check imports Node's own modules and nothing
      # else (tests/unit/deploy-check-imports.test.mjs holds it to that), so
      # installing 175 packages bought this job a minute and nothing more.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # What the site serves before the deploy: the commit, when the build
      # wrote one, and a signature of index.html for a release that did not.
      - name: Record what is live now
        id: before
        if: env.DEPLOY_URL != ''
        shell: bash
        run: |
          set -uo pipefail
          html=$(curl -fsS --max-time 15 -D headers.txt "$DEPLOY_URL" || true)
          live=$(printf '%s' "$html" | grep -oE '<meta name="build-sha" content="[0-9a-f]{7,40}"' | grep -oE '[0-9a-f]{7,40}' | head -1 || true)
          signature=$( { printf '%s' "$html"; grep -iE '^(etag|last-modified):' headers.txt || true; } | sha256sum | cut -d' ' -f1)
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "Live before the deploy: ${live:-an untagged release}."
      # A Verify run can be re-run weeks later, and its completion arrives here
      # looking exactly like a fresh one. Pressed, it would put the old commit
      # back on the site. So a commit deploys only when it is on main and the
      # site is not already serving it or something newer. When the site's
      # commit cannot be read, only the tip of main deploys: that can delay a
      # release by one push, and cannot roll one back.
      #
      # A dispatch is a person choosing, so it may go backwards: that is what
      # it is for. It is still held to what makes a commit deployable -- it is
      # on main, and the Verify run its push started went green -- because a
      # dispatch pressed a minute after a push used to deploy a commit whose
      # Verify was still running. A refusal here is a red run, not a warning:
      # the person asked for a deploy and did not get one. `force` skips both
      # questions and says so on the run.
      - name: Decide whether this commit may deploy
        id: guard
        shell: bash
        env:
          LIVE: ${{ steps.before.outputs.live }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          decide() { echo "deploy=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }
          if [ "$MANUAL" = "true" ]; then
            if [ "$FORCE" = "true" ]; then
              decide true "::warning title=Deployed without the gate::Dispatched by hand with \`force\`: $EXPECTED_SHA deploys without being checked against main or against Verify."
              exit 0
            fi
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
              echo "::error title=Nothing was deployed::$EXPECTED_SHA is not on main. Merge it first, or dispatch again with \`force\`."
              exit 1
            fi
            # The push run, not a pull request's: only a push runs the
            # end-to-end tier. A commit from the middle of a merged branch was
            # never pushed to main by itself and has no such run; the merge
            # commit that brought it in does.
            if ! passed=$(gh api "repos/$GH_REPO/actions/workflows/verify.yml/runs?head_sha=$EXPECTED_SHA&event=push&status=success&per_page=1" --jq '.total_count'); then
              echo "::error title=Nothing was deployed::Could not ask whether Verify passed for $EXPECTED_SHA. Nothing is deployed on a question that went unanswered."
              exit 1
            fi
            if [ "${passed:-0}" -lt 1 ]; then
              echo "::error title=Nothing was deployed::No Verify run from a push went green for $EXPECTED_SHA. Wait for it, name the merge commit, or dispatch again with \`force\`."
              exit 1
            fi
            if [ -n "$LIVE" ] && git cat-file -e "$LIVE^{commit}" 2>/dev/null && [ "$(git rev-parse "$LIVE^{commit}")" != "$EXPECTED_SHA" ] && git merge-base --is-ancestor "$EXPECTED_SHA" "$LIVE"; then
              decide true "::warning title=Rolling back::Dispatched by hand: the site serves $LIVE and goes back to $EXPECTED_SHA, which Verify passed."
            else
              decide true "Dispatched by hand: deploying $EXPECTED_SHA, which is on main and which Verify passed."
            fi
            exit 0
          fi
          git fetch --quiet origin main
          tip=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$tip"; then
            decide false "::warning title=Nothing was deployed::$EXPECTED_SHA is no longer on main, so it was not deployed."
            exit 0
          fi
          if [ -n "$LIVE" ] && git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            live=$(git rev-parse "$LIVE^{commit}")
            if [ "$live" = "$EXPECTED_SHA" ]; then
              decide false "The site already serves $EXPECTED_SHA; checking it as it is."
            elif git merge-base --is-ancestor "$EXPECTED_SHA" "$live"; then
              decide false "::warning title=Nothing was deployed::The site serves $live, which is newer than $EXPECTED_SHA. Deploying this run would roll the site back, so it was not pressed."
            else
              decide true "Deploying $EXPECTED_SHA over $live."
            fi
            exit 0
          fi
          if [ "$EXPECTED_SHA" = "$tip" ]; then
            decide true "The site does not say which commit it serves; $EXPECTED_SHA is the tip of main, so it deploys."
          else
            decide false "::warning title=Nothing was deployed::The site does not say which commit it serves and $EXPECTED_SHA is not the tip of main ($tip), so this run cannot tell a release from a rollback. The tip deploys when its own Verify goes green."
          fi
      # The hook is a secret, and this job also runs the repository's own deploy
      # check. It is handed to the two steps that need it and to nothing else;
      # the rest of the job only learns whether it exists.
      - name: See whether a deploy hook is configured
        id: hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Trigger Render deploy
        id: trigger
        if: steps.guard.outputs.deploy == 'true' && steps.hook.outputs.configured == 'true'
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          # The hook URL carries its own key, so it is the secret in full and
          # never echoed. Only the status line is printed. `ref` is the commit
          # Verify proved (render.com/docs/deploy-hooks): without it Render
          # builds the branch head. 200 is a deploy started, 202 one queued
          # behind a deploy already running; a 404 here is Render not finding
          # the commit, and curl -f fails the step on it.
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) hook="$RENDER_DEPLOY_HOOK&ref=$EXPECTED_SHA" ;;
            *) hook="$RENDER_DEPLOY_HOOK?ref=$EXPECTED_SHA" ;;
          esac
          status=$(curl -fsS -w '%{http_code}' -o /tmp/deploy-response -X POST "$hook")
          echo "Render accepted the deploy request for $EXPECTED_SHA (HTTP $status)."
          echo "triggered=true" >> "$GITHUB_OUTPUT"
      # Same reason the check announces its own skip: a job named "Deploy"
      # reporting green without deploying anything is worse than no job at all.
      - name: Explain skipped deploy
        if: steps.guard.outputs.deploy == 'true' && steps.hook.outputs.configured != 'true'
        run: |
          echo "::warning title=Nothing was deployed::RENDER_DEPLOY_HOOK is not configured, so no deploy was triggered and the site still serves whatever was last pushed by hand. Add the repository secret to turn automatic deploys on: Render dashboard -> the service -> Settings -> Deploy Hook -> copy the URL."
      # The strict signal is a `<meta name="build-sha">` in index.html naming
      # the commit the build came from (vite.config.js writes it from
      # RENDER_GIT_COMMIT): the job waits until the site serves exactly the
      # commit it pressed. A later one does not count -- "or a later one" is how
      # an unverified commit passed this check. A release that carries no tag
      # falls back to index.html, or its ETag / Last-Modified, differing from
      # what was live before the deploy was pressed.
      - name: Wait for the new release to go live
        if: env.DEPLOY_URL != '' && steps.trigger.outputs.triggered == 'true'
        shell: bash
        env:
          BEFORE: ${{ steps.before.outputs.signature }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            html=$(curl -fsS --max-time 15 -D headers.txt "$DEPLOY_URL" || true)
            live=$(printf '%s' "$html" | grep -oE '<meta name="build-sha" content="[0-9a-f]{7,40}"' | grep -oE '[0-9a-f]{7,40}' | head -1 || true)
            if [ -n "$live" ]; then
              case "$EXPECTED_SHA" in
                "$live"*)
                  echo "The site serves $live."
                  break
                  ;;
              esac
              echo "Still serving $live."
            elif [ -n "$html" ]; then
              signature=$( { printf '%s' "$html"; grep -iE '^(etag|last-modified):' headers.txt || true; } | sha256sum | cut -d' ' -f1)
              if [ "$signature" != "$BEFORE" ]; then
                echo "::warning title=Release carries no commit::index.html changed since the deploy was pressed, but it names no build-sha, so this run cannot say which commit is live."
                break
              fi
              echo "Still serving the release from before the deploy."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Deploy never went live::After 20 minutes $DEPLOY_URL still does not serve $EXPECTED_SHA. Check the Render dashboard's deploy log."
              exit 1
            fi
            sleep 20
          done
      - name: Check deployed app
        if: env.DEPLOY_URL != ''
        run: node scripts/check-deploy.mjs
      - name: Explain unobserved deploy
        if: env.DEPLOY_URL != '' && steps.trigger.outputs.triggered != 'true'
        run: |
          echo "::warning title=Checked the site as it was::No deploy was triggered by this run, so the check above ran against whatever release the site already served."
      # A skipped check reports the same green tick as a passed one, so with the
      # secret unset this job would read as evidence that a deployment had been
      # verified when nothing had been fetched at all. An annotation is the only
      # part of a run that survives into the checks list.
      - name: Explain skipped check
        if: env.DEPLOY_URL == ''
        run: |
          echo "::warning title=No deployment was checked::DEPLOY_URL is not configured, so this job fetched nothing. It is green because it did no work, not because a deployed app passed. Set the DEPLOY_URL repository secret to turn the check on."

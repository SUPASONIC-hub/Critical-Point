name: Case Check

# N47 (owner's answer Q12 (1), 2026-11-18): a pull request that touches a side
# case file gets check:case's warnings as a summary line per case -- the count
# by kind, never the list (a long list on every PR is skimmed past). The full
# list is `npm run check:case -- sideNN` on the branch, and the whole picture
# for the next Season is `npm run report:season-ready`.
#
# Warnings only. The job never fails and nothing waits on it: check:case's
# exit code is 0 whatever it finds (scripts/check-case.mjs), the step is
# `continue-on-error`, and Verify stays the check that decides a merge.

on:
  pull_request:
    paths:
      - "src/nodes/side*.js"
      - "src/locales/*/nodes/side*.js"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  case-warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browser: none
      - name: check:case on the side cases this pull request touches (warnings only)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ids=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'src/nodes/side*.js' 'src/locales/*/nodes/side*.js' \
            | sed -nE 's#.*/(side[0-9]{2})\.js$#\1#p' | grep -v '^side00$' | sort -u | tr '\n' ' ')
          if [ -z "$ids" ]; then
            echo "No side case file changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # shellcheck disable=SC2086
          node scripts/check-case.mjs --summary $ids > case-summary.txt || true
          {
            echo "### check:case (경고만, 실패하지 않음)"
            echo
            sed 's/^/- /' case-summary.txt
            echo
            echo "자세히: \`npm run check:case -- $ids\` · 다음 Season 준비표: \`npm run report:season-ready\`"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            case "$line" in
              *"경고 없음"*) ;;
              *) echo "::warning title=check:case::$line" ;;
            esac
          done < case-summary.txt

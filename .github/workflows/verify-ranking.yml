name: Verify Ranking

# Live since #216 merged (2026-10-23): this daily job writes marks into the
# live ranking rows through ranking_set_recheck_marks, the function of
# migration 20261023000000_ranking_recheck_marks.sql, which reached the live
# database with that merge. 서버검증-설계안.md, the 10-21 answers.

# F1 phase 2 (서버검증-설계안.md, the 10-21 answers): read the top ranked runs
# off the live database and work each one out again off the page
# (scripts/verify-ranking-rows.mjs: the score from the decision log, every
# window that carries a replay record, a sealed card cashed below its seal, a
# response time off the window clock) and, since F1 phase 3 (S6), chain each
# run's case rows (src/chainRecheck.js: each case's decisions, and the run's
# counters from one case to the next; a case with no opening snapshot is
# counted as not checked). The report goes to the run's Job Summary, each run
# named by its public tag only. The rows go to files in the runner that are
# never printed and are removed at the end.
#
# The read is split (서버검증-설계안.md, S6): one query lists the top runs
# (run ids only), then one query per run brings that run's rows (up to 55 case
# rows with their logs), so no Management API answer holds more than one run.
# The run ids go from runs.json into each query's file and are never printed.
#
# Then it writes what it found: one statement (verify-ranking-rows --marks-sql)
# calls ranking_set_recheck_marks for every run it checked, with the marks the
# run earned and none for a run that earned none, so a mark the run no longer
# earns is taken off. The function states the four checker marks whole, so the
# chain's mark (chain-off-log) goes in the same call as phase 2's, from the same
# run of the checker over the same rows: never a call of its own. The marks sit in `suspicion` beside the insert trigger's;
# nothing is refused or hidden for them (decision 2 (1)). A run played under
# other table rules is not checked and not written.
#
# The key is the test week's way (test-week.yml): no new secret, the query
# goes through the Management API with the SUPABASE_ACCESS_TOKEN Migration
# Drift uses (`supabase db query --linked`, each query one SELECT that the unit
# test holds to nothing else). Without the token the run says so and reads nothing.
#
# Once a day at 23:55 KST, after the test week's 23:40 read, and by hand. A
# run by hand can leave the marks unwritten (`write`: false) to read only.
#
# D2, the hall of fame (D2-명예의전당-설계안-20261021.md, all (1), question
# 9 (1)): the read lists, beside the top `limit`, each open board's first ten
# seasons that could stand (verify-ranking-rows --runs-sql --per-board). Right
# after the marks, one read-only SELECT counts each board's seasons with no
# mark over the whole board (hall_of_fame_counts: the threshold of ten is not
# counted within the rows read), and from the same check of the same rows
# (src/hallOfFame.js, verify-ranking-rows --hall-of-fame-sql) one statement
# calls hall_of_fame_settle (20261102040000_hall_of_fame.sql) with each
# board's first three clean, checked seasons; it counts again itself and
# refuses a place below ten. The check is not run twice, so
# what was checked and what is posted cannot differ. Then a job of its own,
# the only one with `contents: write`, reads the public view and force-pushes
# one commit with the page to the `hall-of-fame` branch, an orphan with no
# history (a season taken out is gone from it the next day). That branch is
# no ruleset's, starts no Verify and no Deploy; main is never written. A
# failure leaves the tables and the branch as they were the day before.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many of the top ranked runs to read"
        required: false
        default: "20"
      write:
        description: "Write the marks into the ranking rows (false: read only)"
        required: false
        default: "true"
  schedule:
    - cron: "55 14 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      settled: ${{ steps.hall.outputs.settled }}
    env:
      # Not a secret: it is the host name in the site's own connect-src.
      SUPABASE_PROJECT_REF: kiazzdbpkazwqhhimdib
      RANKING_LIMIT: ${{ inputs.limit || '20' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: See whether an access token is configured
        id: token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Explain the skipped read
        if: steps.token.outputs.configured != 'true'
        run: |
          echo "::warning title=The ranking was not read::SUPABASE_ACCESS_TOKEN is not configured, so this run asked the database nothing."
      - uses: ./.github/actions/setup
        if: steps.token.outputs.configured == 'true'
        with:
          browser: none
      # The rows stay in rows/, one file per run. What the CLI said on failure
      # is put through Migration Drift's redaction before it reaches this
      # public log.
      - name: Read the ranked runs
        id: read
        if: steps.token.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          query() {
            npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f "$1" > "$2" 2> query.err
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "supabase db query exited $code:"
              node scripts/check-migration-drift.mjs --say-failure "$2" query.err
              exit 1
            fi
          }
          started=$SECONDS
          node scripts/verify-ranking-rows.mjs --runs-sql --limit="$RANKING_LIMIT" --per-board=10 > runs.sql || exit 1
          query runs.sql runs.json
          runs=$(node scripts/verify-ranking-rows.mjs --run-count runs.json) || exit 1
          mkdir -p rows
          for at in $(seq 1 "$runs"); do
            node scripts/verify-ranking-rows.mjs --run-sql runs.json --at="$at" > run.sql || exit 1
            query run.sql "rows/$at.json"
          done
          rows=0
          if [ "$runs" -gt 0 ]; then
            rows=$(node -e 'const fs = require("fs"); let n = 0; for (const f of process.argv.slice(1)) { const r = JSON.parse(fs.readFileSync(f, "utf8")); n += (r.rows ?? r).length; } console.log(n)' rows/*.json)
          fi
          echo "Read $runs runs, $rows rows, in $((SECONDS - started)) s ($((runs + 1)) queries)." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
      - name: Write the report
        if: steps.token.outputs.configured == 'true' && steps.read.outputs.runs != '0'
        shell: bash
        run: |
          started=$SECONDS
          {
            echo "### Ranked runs worked out again and chained (top $RANKING_LIMIT, and each open hall of fame board's first 10 candidates)"
            echo '```'
            node scripts/verify-ranking-rows.mjs rows/*.json --redact
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Checked in $((SECONDS - started)) s." | tee -a "$GITHUB_STEP_SUMMARY"
      # The statement names run ids, so it is never printed; what the CLI said
      # on failure goes through the same redaction as the read.
      - name: Write the marks
        if: steps.token.outputs.configured == 'true' && steps.read.outputs.runs != '0' && (github.event_name == 'schedule' || inputs.write != 'false')
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          # One statement for every run, each run's phase 2 and chain marks in
          # one tuple (ranking_set_recheck_marks drops a checker mark not passed).
          node scripts/verify-ranking-rows.mjs rows/*.json --marks-sql > marks.sql || exit 1
          if [ ! -s marks.sql ]; then echo "No checked run to write."; exit 0; fi
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f marks.sql > marked.json 2> write.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code:"
            node scripts/check-migration-drift.mjs --say-failure marked.json write.err
            exit 1
          fi
          echo "Marked $(node -e 'const r = JSON.parse(require("fs").readFileSync("marked.json", "utf8")); console.log((r.rows ?? r)[0]?.marked_rows ?? 0)') ranking rows." | tee -a "$GITHUB_STEP_SUMMARY"
      # The hall of fame, from the same rows and the same check, after the
      # marks: the function reads them back (a place must be clean and
      # rechecked) and refuses the whole call otherwise.
      - name: Settle the hall of fame
        id: hall
        if: steps.token.outputs.configured == 'true' && steps.read.outputs.runs != '0' && (github.event_name == 'schedule' || inputs.write != 'false')
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          # Each board's count over the whole board, read after the marks.
          node scripts/verify-ranking-rows.mjs --hall-of-fame-counts-sql > counts.sql || exit 1
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f counts.sql > counts.json 2> hall.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code; the hall of fame is as it was:"
            node scripts/check-migration-drift.mjs --say-failure counts.json hall.err
            exit 1
          fi
          {
            echo "### Hall of fame (D2)"
            echo '```'
            node scripts/verify-ranking-rows.mjs rows/*.json --hall-of-fame --counts=counts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/verify-ranking-rows.mjs rows/*.json --hall-of-fame-sql --counts=counts.json > hall.sql || exit 1
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f hall.sql > hall.json 2> hall.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code; the hall of fame is as it was:"
            node scripts/check-migration-drift.mjs --say-failure hall.json hall.err
            exit 1
          fi
          echo "Hall of fame: $(node -e 'const r = JSON.parse(require("fs").readFileSync("hall.json", "utf8")); console.log(JSON.stringify((r.rows ?? r)[0]?.settled ?? null))')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "settled=true" >> "$GITHUB_OUTPUT"
      - name: Remove the rows
        if: always()
        run: |
          rm -f rows/*.json runs.json runs.sql run.sql query.err marks.sql marked.json write.err counts.sql counts.json hall.sql hall.json hall.err
          if [ -d rows ]; then rmdir rows; fi

  # The page: the public view, as markdown, one commit on the orphan branch
  # `hall-of-fame`, pushed with --force. This job alone may write contents,
  # and it pushes to refs/heads/hall-of-fame and nothing else.
  hall-of-fame-page:
    needs: verify
    if: needs.verify.outputs.settled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SUPABASE_PROJECT_REF: kiazzdbpkazwqhhimdib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: none
      - name: Read the hall of fame and write the page
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          node scripts/verify-ranking-rows.mjs --hall-of-fame-read-sql > view.sql || exit 1
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f view.sql > view.json 2> view.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code; the branch is left as it was:"
            node scripts/check-migration-drift.mjs --say-failure view.json view.err
            exit 1
          fi
          node scripts/verify-ranking-rows.mjs --hall-of-fame-md view.json > "$RUNNER_TEMP/hall-of-fame.md" || exit 1
          rm -f view.sql view.json view.err
          cat "$RUNNER_TEMP/hall-of-fame.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the page to the hall-of-fame branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/hall-of-fame-page"
          mkdir -p "$page"
          cp "$RUNNER_TEMP/hall-of-fame.md" "$page/README.md"
          cd "$page"
          git init -q -b hall-of-fame
          git add README.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "명예의 전당 $(TZ=Asia/Seoul date +%F)"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/hall-of-fame

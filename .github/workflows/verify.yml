name: Verify

# Actions are pinned to a full commit SHA, with the tag it was cut from in a
# comment. A tag can be moved to other code after review; a SHA cannot.
# Dependabot (.github/dependabot.yml) proposes the bumps.

on:
  pull_request:
    # `labeled` is here only so that adding the `e2e` label starts the e2e
    # tier; see the job conditions for what a label event runs.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Pushes
# to main are never cancelled and never superseded: each is a deploy candidate
# (deploy.yml runs after this workflow), so each has a group of its own, named
# by its commit. One group for the branch was not enough: `cancel-in-progress:
# false` protects the run that is running, and GitHub still keeps only one
# *pending* run per group, so of three pushes in a row the middle one was
# cancelled before it started. On 2026-09-27 three commits on main ended with
# no Verify result at all.
#
# A label event gets a group of its own too, named by the label, so adding
# `e2e` does not cancel the code run that is already verifying the same commit
# -- and adding `visual` a moment later does not cancel the run `e2e` started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-quick:
    # Adding a label changes no code, so it does not re-run the quick tier.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node comes from .node-version, which is also what the Render build
      # reads. CI used to say `node-version: 24` while that file said 22.16.0,
      # so every check ran on a major the deploy never built with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # verify:static; every spec loaded and listed; the production build, made
      # with a placeholder backend so telemetry, the ranking and the board are
      # switched on as they are in a release; the bundle budgets; the offline
      # deploy check; then the runtime smoke and the @prod-tagged specs against
      # that build, served by `vite preview` under the headers render.yaml
      # declares. The debug tools are compiled out of it, so those play from
      # the intro or from a seeded save.
      - run: npm run verify:quick
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quick-playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  verify-e2e:
    # Every push; a pull request carrying the `e2e` label (on the label event
    # itself only when the label added is `e2e`); and every Dependabot pull
    # request, because a dependency bump is the change most likely to break the
    # running game while the static tier stays green. Nothing here reads a
    # secret, so it runs the same on a Dependabot pull request.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.action != 'labeled') ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    # The suite used to be one job that grew with the season: 25 -> 45 -> 80
    # minutes, most of it one test walking all fifty-five cases. The walk is now
    # eight segments with a job of their own below, and the uninterrupted walk
    # moved to the weekly Full Coverage workflow. What is left here is split
    # test by test, so each shard takes about a third of it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One Node version for CI and the Render build: .node-version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The performance budgets are measured on the production build, so they
      # run with the @prod specs in verify-quick, not here.
      - run: npm run test:e2e -- --skip-segments --shard=${{ matrix.shard }}/3
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-playwright-diagnostics-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  verify-season:
    # The season walk in segments, under the same conditions as verify-e2e. It
    # has a matrix of its own because Playwright shards a list in order, and the
    # segments sit next to each other in one file: as part of the suite all
    # eight landed on one shard, which took 17 minutes while the other two took
    # 5 and 3. Two segments a shard is about four minutes.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.action != 'labeled') ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One Node version for CI and the Render build: .node-version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      # The segments run on Chromium alone, so this job has its own, smaller
      # browser cache.
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e -- --segments --shard=${{ matrix.shard }}/4
      - name: Upload season segment diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: season-segments-diagnostics-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

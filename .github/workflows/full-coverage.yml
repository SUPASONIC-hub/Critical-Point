name: Full Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  full-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `check:visual-baselines` reads the log of each baseline PNG to tell a
      # stale one from a current one. The default one-commit clone makes every
      # file look equally fresh, and the check skips rather than lie.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # One Node version for CI and the Render build: .node-version.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full
      - name: Upload full coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

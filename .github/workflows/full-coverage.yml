name: Full Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  full-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:full

name: Funnel

# Players over time and where seasons stop (E-4(a) of the 2026-10-22 review;
# the player tables since the 2026-10-26 web-first roadmap). Every day this reads
# the case rows of every run off the live database and writes to the run's Job
# Summary the devices new and active, runs begun and seasons finished for each
# of the last 14 days and 8 weeks, then how far runs got, where they stopped, how long players stay away
# between rows, how many days a finished season took, how many finished
# seasons were followed by a new run on the same device, and the funnel of
# runs marked NEW GAME+ (scripts/report-funnel.mjs). Read only, aggregates
# only: the rows it fetches go to a file in the runner that is never printed,
# and the summary carries no run id, device or name. Only the devices that
# agreed to send data are in it, and the summary says so.
#
# No new secret: the same SUPABASE_ACCESS_TOKEN and `supabase db query
# --linked` as Test Week, a single SELECT that the report's unit test holds to
# one read-only statement and check:grants runs over a replayed database.
# Without the token the run says so in a warning and reads nothing.
#
# It also reads the two limits that hold for everyone together (new cloud-save
# codes and telemetry bytes in a day, scripts/report-budgets.mjs), as Board
# Reports does in the morning, and a scheduled run fails when one is at 80%.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Only runs whose first row came on or after this day (YYYY-MM-DD, KST); empty reads every run"
        required: false
        default: ""
  schedule:
    # 22:10 KST every day, so the player table is a day old at most; not Test
    # Week's 23:40.
    - cron: "10 13 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Not a secret: it is the host name in the site's own connect-src.
      SUPABASE_PROJECT_REF: kiazzdbpkazwqhhimdib
      FUNNEL_SINCE: ${{ inputs.since || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: See whether an access token is configured
        id: token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; fi
      - name: Explain the skipped read
        if: steps.token.outputs.configured != 'true'
        run: |
          echo "::warning title=The funnel was not read::SUPABASE_ACCESS_TOKEN is not configured, so this run asked the database nothing."
      - uses: ./.github/actions/setup
        if: steps.token.outputs.configured == 'true'
        with:
          browser: none
      # The rows stay in rows.json. What the CLI said on failure is put
      # through Migration Drift's redaction before it reaches this public log.
      - name: Read the runs
        if: steps.token.outputs.configured == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          node scripts/report-funnel.mjs --sql > funnel.sql || exit 1
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f funnel.sql > rows.json 2> query.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code:"
            node scripts/check-migration-drift.mjs --say-failure rows.json query.err
            exit 1
          fi
          echo "Read $(node -e 'const r = JSON.parse(require("fs").readFileSync("rows.json", "utf8")); console.log((r.rows ?? r).length)') runs."
      # The same tables go to a file too, with their numbers as JSON, and up
      # as the run's artifact (2026-11-03): the Job Summary cannot be read
      # from the CLI or the API, and the W47 verdict (11-23) reads these. The
      # folder holds only what the summary says -- never rows.json.
      - name: Write the summary
        if: steps.token.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p funnel-report
          node scripts/report-funnel.mjs rows.json > funnel-report/funnel-summary.md
          node scripts/report-funnel.mjs rows.json --json > funnel-report/funnel-summary.json
          cat funnel-report/funnel-summary.md >> "$GITHUB_STEP_SUMMARY"
      # Yesterday's errors and feedback (N4 of 2026-11-12, scripts/report-ops-health.mjs):
      # counts and the top three error messages cut to 40 characters and
      # masked; feedback text never. Then how long main has been quiet (N7):
      # a warning from 45 days, before GitHub turns scheduled runs off at 60.
      - name: Read yesterday's errors and feedback
        if: ${{ !cancelled() && steps.token.outputs.configured == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          node scripts/report-ops-health.mjs --sql > ops.sql || exit 1
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f ops.sql > ops.json 2> ops.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code:"
            node scripts/check-migration-drift.mjs --say-failure ops.json ops.err
            rm -f ops.sql ops.json ops.err
            exit 1
          fi
          node scripts/report-ops-health.mjs ops.json "$(git log -1 --format=%cI)" >> "$GITHUB_STEP_SUMMARY" || exit 1
          rm -f ops.sql ops.json ops.err
      - name: Warn when main has been quiet
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          warning="$(node scripts/report-ops-health.mjs --inactivity "$(git log -1 --format=%cI)")"
          case "$warning" in *⚠*) echo "::warning title=Scheduled runs may stop::main has had no commit for 45+ days; GitHub turns scheduled workflows off at 60. Workflow Keepalive turns them back on monthly."; echo "$warning" >> "$GITHUB_STEP_SUMMARY";; esac
      - name: Remove the rows
        if: always()
        run: rm -f rows.json query.err ops.json ops.err
      - name: Upload the summary
        if: steps.token.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: funnel-summary
          path: funnel-report
          if-no-files-found: ignore
          retention-days: 45
      # The limits that hold for everyone together (scripts/report-budgets.mjs, M3
      # of the 2026-11-03 security review): counts and limits only. A scheduled
      # run fails at 80%, so the failed-run mail is the alarm.
      - name: Read the global budgets
        id: budgets
        if: ${{ !cancelled() && steps.token.outputs.configured == 'true' }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e -uo pipefail
          node scripts/report-budgets.mjs --sql > budgets.sql || exit 1
          npx supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json -f budgets.sql > budgets.json 2> budgets.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "supabase db query exited $code:"
            node scripts/check-migration-drift.mjs --say-failure budgets.json budgets.err
            exit 1
          fi
          node scripts/report-budgets.mjs budgets.json >> "$GITHUB_STEP_SUMMARY" || exit 1
          echo "near=$(node scripts/report-budgets.mjs --near budgets.json)" >> "$GITHUB_OUTPUT"
          rm -f budgets.sql budgets.json budgets.err
      - name: Fail when a global budget is near its end
        if: ${{ !cancelled() && steps.token.outputs.configured == 'true' && github.event_name == 'schedule' && steps.budgets.outputs.near != '0' && steps.budgets.outputs.near != '' }}
        run: |
          echo "::error title=A global limit is near::${{ steps.budgets.outputs.near }} limit(s) for everyone together are at 80% or more of the day. When one runs out, every player's request of that kind is refused until the day ends. Read the Job Summary; raise the value in private_settings (README section 6)."
          exit 1

name: Layout probe case22

# Throwaway (2026-11-27): E1h missed case22; en/ja x 3 phones = 6 jobs.
# 360 and 411 take 3 shards, 390 takes 2: the last shard holds the 55 heavy-board tests.
on:
  push:
    branches: [probe-case22-1127]

permissions:
  contents: read

jobs:
  sweep:
    name: c22 ${{ matrix.lang }} ${{ matrix.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lang: en, size: "small phone=360x740" }
          - { lang: en, size: "wide phone=411x846" }
          - { lang: en, size: "phone=390x844" }
          - { lang: ja, size: "small phone=360x740" }
          - { lang: ja, size: "wide phone=411x846" }
          - { lang: ja, size: "phone=390x844" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: mkdir -p layout-report
      - name: Measure
        env:
          LAYOUT_REPORT_DIR: layout-report
          LAYOUT_LANG: ${{ matrix.lang }}
          LAYOUT_SIZES: ${{ matrix.size }}
        run: node scripts/run-e2e.mjs tests/layout-sweep.spec.js --project=mobile-chromium --workers=3 --fully-parallel --retries=0 --grep " case22 "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: c22-${{ matrix.lang }}-${{ strategy.job-index }}
          path: layout-report
          if-no-files-found: ignore
          retention-days: 3

version: 2
# `labels: []` on each entry: Dependabot's default labels arrive as separate
# `labeled` events right after the pull request opens, and each one started a
# Verify and a Visual Regression run that skipped or cancelled itself, burying
# the one run that checked the code under a column of grey. The workflows key
# Dependabot pull requests on their author, not on a label.
updates:
  # Workflow actions are pinned to commit SHAs; this keeps the SHAs (and the
  # `# vX.Y.Z` comments beside them) moving. One pull request a week.
  - package-ecosystem: github-actions
    directory: /
    labels: []
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    labels: []
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch releases of the tools, together.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["@playwright/test"]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # @playwright/test moves only together with the Playwright container in
      # visual-regression.yml and scripts/run-e2e.mjs and a re-recorded set of
      # baselines; `npm run check:visual-baselines` fails when they disagree.
      # A lone bump would always be red, so it is left to a person.
      - dependency-name: "@playwright/test"
      # Major versions change APIs; they are a deliberate upgrade, not a weekly one.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

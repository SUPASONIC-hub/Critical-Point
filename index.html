<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="판단이 깊어지는 순간을 추적하는 대화형 의사결정 게임 프로토타입"
    />
    <meta name="theme-color" content="#06090a" />
    <meta name="color-scheme" content="dark" />
    <!-- The site's own URLs below are written root-relative. The build makes them
         absolute from SITE_URL (or Render's RENDER_EXTERNAL_URL), because a
         crawler reading og:image does not resolve a relative one. -->
    <link rel="canonical" href="/" vite-ignore />
    <!-- The same game in its other languages (open to the end since 10-28): a
         crawler finds them by these, and each opens in its own language. -->
    <link rel="alternate" hreflang="ko" href="/" vite-ignore />
    <link rel="alternate" hreflang="en" href="/?lang=en" vite-ignore />
    <link rel="alternate" hreflang="ja" href="/?lang=ja" vite-ignore />
    <link rel="alternate" hreflang="x-default" href="/" vite-ignore />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="CRITICAL POINT 임계점" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="CRITICAL POINT 임계점 - 판단이 깊어지는 순간" />
    <meta
      property="og:description"
      content="트리거랩의 사건을 따라가며 어떤 조건에서 생각이 깊어지는지 확인하는 대화형 의사결정 게임"
    />
    <meta property="og:image" content="/triggerlab-key-visual.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="해 질 녘 고층 옥상에서 도시를 내려다보는 두 분석관의 뒷모습" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRITICAL POINT 임계점 - 판단이 깊어지는 순간" />
    <meta
      name="twitter:description"
      content="트리거랩의 사건을 따라가며 선택, 반론, 자원 변화를 기록하는 플레이테스트 프로토타입"
    />
    <meta name="twitter:image" content="/triggerlab-key-visual.jpg" />
    <meta name="twitter:image:alt" content="해 질 녘 고층 옥상에서 도시를 내려다보는 두 분석관의 뒷모습" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The intro's key visual is the LCP element. These mirror the <picture> in
         IntroScreen.jsx exactly -- same media split, the phone's by density and
         the wide screen's by width with the same sizes (getArtSources in
         src/responsiveArt.js) -- so the browser preloads the file the picture
         then picks, at every DPR and width. A preload that disagrees with the
         picture downloads the art twice. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/triggerlab-key-visual-480.webp 1x, /triggerlab-key-visual-960.webp 2x"
      media="(max-width: 700px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/triggerlab-key-visual-960.webp 960w, /triggerlab-key-visual.webp 1672w"
      imagesizes="100vw"
      media="not all and (max-width: 700px)"
      fetchpriority="high"
    />
    <!-- The one font file (src/styles/tokens.css). Preloaded so the intro's text
         is not held until the stylesheet that names it has been parsed. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/pretendard-cp.woff2"
      crossorigin
    />
    <title>CRITICAL POINT 임계점 - 판단이 깊어지는 순간</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The page is drawn by its script. Without one it was a black screen that
         said nothing. -->
    <!-- Inline styles only: with no script the deferred sheet may still load
         (its <noscript> link), so every property this block relies on is set
         here. The links are each browser's own help page (개선 포인트 E2). -->
    <noscript>
      <div style="box-sizing: border-box; max-width: 34rem; margin: 0 auto; padding: 48px 16px; color: #f2f6f3; background: #06090a; font: 16px/1.6 sans-serif; text-align: center; word-break: keep-all; overflow-wrap: anywhere">
        <p style="margin: 0 0 12px; font-weight: 700">
          사건 파일이 열리지 않았습니다. 분석 시스템이 이 브라우저에서 실행 승인을 받지 못했습니다.
        </p>
        <p style="margin: 0 0 24px">
          임계점은 자바스크립트로 그려지는 게임입니다. 브라우저 설정에서 자바스크립트를 켠 뒤 다시 열어 주세요.
        </p>
        <p style="margin: 0 0 8px; color: #c9d3cd; font-size: 14px">자바스크립트 켜는 방법 (각 브라우저 공식 도움말)</p>
        <ul style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin: 0; padding: 0; list-style: none">
          <li><a href="https://support.google.com/chrome/answer/114662?hl=ko" style="display: inline-block; padding: 8px 4px; color: #d9ff62; text-decoration: underline">Chrome</a></li>
          <li><a href="https://support.apple.com/ko-kr/102456" style="display: inline-block; padding: 8px 4px; color: #d9ff62; text-decoration: underline">Safari (iPhone)</a></li>
          <li><a href="https://www.samsung.com/us/support/troubleshoot/TSG10007306/" style="display: inline-block; padding: 8px 4px; color: #d9ff62; text-decoration: underline">삼성 인터넷</a></li>
          <li><a href="https://support.mozilla.org/kb/javascript-settings-for-interactive-web-pages" style="display: inline-block; padding: 8px 4px; color: #d9ff62; text-decoration: underline">Firefox</a></li>
          <li><a href="https://support.microsoft.com/ko-kr/office/enable-javascript-7bb9ee74-6a9e-4dd1-babf-b0a1bb136361" style="display: inline-block; padding: 8px 4px; color: #d9ff62; text-decoration: underline">Edge</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

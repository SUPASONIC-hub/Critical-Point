# NOTHING IN THIS FILE REACHES THE LIVE SERVICE. Read that before trusting a
# line of it.
#
# This is a Blueprint spec, and Render applies a Blueprint only to a service it
# manages as one. The service actually serving the game was created by hand in
# the dashboard, so it takes its settings from there and this file is inert --
# kept because it is the written record of what the service is supposed to be,
# and because a Blueprint-managed service would need it.
#
# Two of the settings below were measured against the live site on 2026-09-18
# and neither was in effect:
#
#   autoDeploy  -- every release until then was someone pressing `Deploy latest
#                  commit`. Deploys are automatic now because
#                  `.github/workflows/deploy.yml` calls a Render deploy hook
#                  after Verify goes green; the dashboard's own Auto-Deploy is
#                  off (see below).
#   headers     -- the site was serving `x-content-type-options` and nothing
#                  else: no CSP, no Referrer-Policy, no Permissions-Policy, and
#                  `/index.html` cached for five minutes rather than `no-cache`.
#                  They were added to the dashboard by hand, and
#                  `npm run check:deploy` is what noticed they were missing.
#
# So: change a value here and the live site does not move. Change it in the
# dashboard too, and keep the two in step -- the README's 배포 section says how.
services:
  - type: web
    runtime: static
    name: critical-point
    # Only a commit whose Verify run went green is deployed (deploy.yml), so the
    # static checks are not run a second time here.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    # Off, and it has to stay off. Inert here -- the dashboard decides -- but
    # this is the record of the dashboard: Render's own Auto-Deploy builds every
    # push to main before Verify has run. deploy.yml presses the deploy hook
    # with `ref=<the verified commit>`, and Render turns Auto-Deploy off by
    # itself when a service is deployed at a named commit ("Auto-Deploy has
    # been disabled to prevent accidental deploys"). That notice is the
    # intended state, not a setting to undo.
    autoDeploy: false
    # Declared here without values so the keys survive a service rebuild. Set
    # them in the Render dashboard; when they are missing the app silently runs
    # with telemetry and the remote leaderboard switched off.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # Mirrored by hand in the dashboard under Settings -> Headers. These are
    # the source of truth for what the site *should* send; `check:deploy`
    # asserts them against what it actually sends -- each security header by
    # value, the CSP by value (scripts/deploy-policy.mjs), and the cache policy
    # of the page and of one fingerprinted asset.
    # `node scripts/check-deploy.mjs --offline` checks the values below and the
    # built dist/index.html without a network.
    headers:
      # Vite fingerprints everything under assets/, so those files never change
      # behind a given name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The page is the one file that names the fingerprinted ones, so it is
      # asked for again on every visit. Both spellings: a browser asks for `/`,
      # and a rule for /index.html alone was measured not to cover it.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Two years, the length browsers' preload lists ask for. No `preload`:
      # that is a promise about the whole registrable domain, and on
      # *.onrender.com the domain is not ours to promise for.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Scripts, styles and the font are for this origin only. Not on `/*`: the
      # key visual is what a link preview on another site shows.
      - path: /assets/*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      # Everything the game has no use for, off by name. Sound is Web Audio and
      # needs no permission; autoplay and fullscreen are left to the browser.
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), serial=(), usb=(), xr-spatial-tracking=()
      # script-src is 'self' only: the built page has no inline script and no
      #   inline handler (the critical-CSS loader used to be an onload=).
      # style-src keeps 'unsafe-inline' for the inlined critical CSS block and
      #   React's style attributes; styles cannot run code.
      # img-src/font-src: every image and the one Pretendard subset ship with the
      #   app. data: stays for fonts/images small enough for Vite to inline.
      # connect-src: the Supabase REST API. Narrow it to the project's own
      #   https://<ref>.supabase.co when setting it in the dashboard.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; manifest-src 'self'; worker-src 'self'"
